# Publishes docs/site/ to GitHub Pages.
#
# The App Store listing has to point at a privacy policy URL and a support URL,
# and both have to be reachable when App Review looks. This is the cheapest
# hosting that keeps the text under review in the same repository as the app it
# describes — a privacy policy that drifts from the app is the failure mode
# worth designing against.
#
# Pages is enabled on the repository with its build type set to `workflow`
# (Settings → Pages → Build and deployment → Source: GitHub Actions). The site
# lands at https://arime.github.io/chores/ and this workflow prints the URL.
#
# It uploads `docs/site` alone, which is what puts the pages at /privacy/ and
# /support/ — the URLs docs/appstore/ already points the listing at. GitHub's
# starter workflow uploads the whole repository instead, which would put them at
# /docs/site/privacy/. Only one workflow may deploy Pages: two would both fire on
# a push to main and the site would be whichever finished last.

name: Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled Pages
# deployment can leave the site on the previous commit with no sign of it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Current majors, which are ahead of the ones GitHub's starter workflow
      # still ships. None of these takes an input that changed between them.
      - uses: actions/checkout@v7

      # The contact address was a placeholder while it was being decided, and
      # this is what stops one coming back: a support page whose only address is
      # SUPPORT_EMAIL_TODO would be worse than no page, and App Review reads
      # these.
      - name: Refuse to publish an unfilled contact address
        run: |
          if grep -rl 'SUPPORT_EMAIL_TODO' docs/site; then
            echo '::error::docs/site still contains SUPPORT_EMAIL_TODO. Replace it with the real address before publishing.'
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

      - id: deploy
        uses: actions/deploy-pages@v5
